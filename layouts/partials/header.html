<!-- Navigation Header -->
<header class="sticky top-0 z-40 w-full border-b border-brand-100/60 bg-cream/90 backdrop-blur-md transition-all duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        <!-- Brand Logo -->
        <a href="{{ .Site.BaseURL }}" class="flex items-center gap-3 group">
            <div class="w-11 h-11 rounded-full bg-brand-600 text-stone-900 flex items-center justify-center text-xl shadow-md group-hover:bg-brand-700 transition">
                <i class="fa-solid fa-paw"></i>
            </div>
            <div>
                <span class="block font-serif font-semibold text-xl leading-tight text-brand-800">{{ .Site.Title }}</span>
                <span class="block text-xs text-stone-500 tracking-wide font-medium">Belöningsbaserad hundträning</span>
            </div>
        </a>

        <!-- Desktop Links -->
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-stone-700">
            <a href="{{ if not .IsHome }}/{{ end }}#om-mig" class="hover:text-brand-800 transition">Om Kristin</a>
            <a href="{{ if not .IsHome }}/{{ end }}#metod" class="hover:text-brand-800 transition">Metodik</a>
            <a href="{{ if not .IsHome }}/{{ end }}#kurser" class="hover:text-brand-800 transition">Kurser &amp; schema</a>
            <a href="{{ if not .IsHome }}/{{ end }}#privat" class="hover:text-brand-800 transition">Privatträning</a>
            <a href="{{ if not .IsHome }}/{{ end }}#kontakt" class="hover:text-brand-800 transition">Kontakt</a>
        </nav>

        <!-- CTA Button -->
        <div class="hidden sm:flex items-center gap-3">
            <button onclick="openBookingModal('Allmän kursanmälan')" class="inline-flex items-center gap-2 bg-accent-500 hover:bg-accent-600 text-stone-900 font-semibold px-5 py-2.5 rounded-full shadow-sm hover:shadow transition transform active:scale-95 text-sm">
                <i class="fa-regular fa-calendar-check"></i>
                Boka kurs
            </button>
        </div>

        <!-- Mobile Menu Toggle Button -->
        <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg text-stone-700 hover:bg-stone-100 focus:outline-none" aria-label="Öppna meny" aria-expanded="false" aria-controls="mobile-menu">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
    </div>

    <!-- Mobile Drawer Menu -->
    <div id="mobile-menu" class="hidden md:hidden border-b border-stone-200 bg-cream px-4 pt-2 pb-6 space-y-3 shadow-lg">
        <a href="{{ if not .IsHome }}/{{ end }}#om-mig" class="mobile-nav-link block py-2 text-stone-700 font-medium hover:text-brand-800">Om Kristin</a>
        <a href="{{ if not .IsHome }}/{{ end }}#metod" class="mobile-nav-link block py-2 text-stone-700 font-medium hover:text-brand-800">Metodik</a>
        <a href="{{ if not .IsHome }}/{{ end }}#kurser" class="mobile-nav-link block py-2 text-stone-700 font-medium hover:text-brand-800">Kurser &amp; schema</a>
        <a href="{{ if not .IsHome }}/{{ end }}#privat" class="mobile-nav-link block py-2 text-stone-700 font-medium hover:text-brand-800">Privatträning</a>
        <a href="{{ if not .IsHome }}/{{ end }}#kontakt" class="mobile-nav-link block py-2 text-stone-700 font-medium hover:text-brand-800">Kontakt</a>
        <button onclick="openBookingModal('Allmän kursanmälan')" class="mobile-nav-link block text-center w-full bg-accent-500 text-stone-900 font-semibold py-3 rounded-xl mt-4 shadow">
            Boka kurs
        </button>
    </div>
</header>
