{{ define "main" }}
<div class="py-12 bg-white border-b border-stone-200/60">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <nav class="flex items-center gap-2 text-xs font-medium text-stone-500 mb-6">
            <a href="/" class="hover:text-brand-800 transition">Startsida</a>
            <span>/</span>
            <span class="text-stone-800">{{ .Title }}</span>
        </nav>

        <h1 class="font-serif text-3xl sm:text-4xl font-bold text-stone-900 mb-4">{{ .Title }}</h1>
        {{ if .Date }}
        <p class="text-xs text-stone-500 mb-6">Publicerat {{ .Date.Format "2006-01-02" }}</p>
        {{ end }}
    </div>
</div>

<div class="py-12 bg-cream">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-sm border border-stone-200/80 prose prose-stone max-w-none text-stone-700 leading-relaxed">
            {{ .Content }}
        </div>

        <div class="mt-8 text-center">
            <a href="/" class="inline-flex items-center gap-2 text-sm font-semibold text-brand-800 hover:text-brand-700">
                <i class="fa-solid fa-arrow-left"></i> Tillbaka till startsidan
            </a>
        </div>
    </div>
</div>
{{ end }}
