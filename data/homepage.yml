private_training:
  badge: Skräddarsydd lösning
  title: Privat hundträning & rådgivning
  description: Har du svårt att få kurstiderna att passa, eller behöver du hjälp
    med specifika utmaningar som hundmöten, koppeldrag, skällande, reaktivitet
    eller ensamhetsträning? Vi skapar en personlig träningsplan anpassad för er
    vardag.
  features:
    - Hembesök eller träning i er närmiljö i Sollentuna & norra Stockholm
    - Noggrann analys av er situation och hundens behov och förutsättningar
    - Skriftlig träningsplan & coaching via e-post/telefon efteråt
  pricing_title: Priser privatträning
  pricing_packages:
    - name: Första konsultering (75 min)
      price: 1 250 kr
      detail: Inkluderar kartläggning och skriftlig träningsplan.
    - name: Uppföljning (60 min)
      price: 850 kr
      detail: Praktisk träning och justeringar.
    - name: Klippkort 3 x 60 min
      price: 2 300 kr
      detail: Spara 250 kr vid paketerad träning.
  cta_text: Boka privatkonsultation
about:
  subtitle: Om Hund Hälsa Kunskap
  title: Hej, jag heter Kristin!
  image: /img/enzo06_webb.jpg
  badge_name: Kristin Ivarsson
  badge_title: Diplomerad instruktör
  paragraphs:
    - Jag driver Hund Hälsa Kunskap med en stor passion för hundars välmående
      och en positiv, givande kommunikation mellan hund och ägare. Min
      målsättning är att ge er verktygen för ett harmoniskt samliv byggt på
      förståelse, trygghet och glädje istället för krav och korrigeringar.
    - Jag är utbildad och diplomerad hundinstruktör samt kantarellsöksinstruktör
      via Glada Jyckar AB och vidareutbildar mig kontinuerligt inom hundens
      etiologi, friskvård, berikning och belöningsbaserade träningsmetoder.
    - I grunden är jag specialistsjuksköterska sedan över 15 år och vårdlärare,
      med stort engagemang för hälsofrämjande arbete och pedagogik. Bland annat
      drev jag projektet Senior med Hund i Sollentuna Kommun.
  qualifications:
    - Diplomerad hundinstruktör
    - Kantarellsöksinstruktör
    - Diplomerad friskvårdsinstruktör
    - Specialistsjuksköterska & pedagog
    - Ansvarsförsäkrad & F-skatt
contact:
  email: kristin@hundhalsakunskap.se
