  location: Sollentuna (Fågelsångsparken, Törnskogen, Sollentuna C)
  service_area: Vi håller kurser och privatträningar i Sollentuna, Helenelund,
    Rotebro, Edsberg, Silverdal, Täby, Danderyd och övriga Norrort i Stockholm
    samt sommarkurser i Söderhamn.
